<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LowBattery | Panel</title><style>
:root{--bg:#07101c;--card:#101d2d;--line:#263d56;--muted:#9db0c5;--blue:#54a8ff;--text:#f5f8fc}*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(ellipse at 50% -10%,#163c6b,transparent 55%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:1100px;margin:auto}.brand{display:flex;align-items:center;gap:10px;padding:5px 2px 22px}.brand img{width:42px;height:42px;object-fit:contain}.brand span{color:var(--blue)}.card{background:linear-gradient(145deg,#111e2e,#0b1522);border:1px solid var(--line);border-radius:20px;padding:18px;margin:13px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#091522;border:1px solid var(--line);border-radius:15px;padding:16px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:6px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:150px}input,select,textarea{width:100%;background:#081321;border:1px solid #2a425d;color:#f5f8fc;border-radius:12px;padding:12px;font-size:14px}textarea{min-height:90px}button{border:0;border-radius:12px;padding:12px 15px;font-weight:800;background:#258af4;color:white;cursor:pointer}button.secondary{background:#20364e}button.danger{background:#7e3041}.request{border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0;background:#0b1624}.request h3{margin:4px 0 8px}.meta{color:var(--muted);font-size:13px;line-height:1.7}.photos{display:flex;gap:9px;overflow-x:auto;margin:12px 0}.photos img{width:145px;height:145px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}.status{font-size:12px;padding:6px 9px;border:1px solid #355371;border-radius:99px;color:#b9d9fa;display:inline-block}.hidden{display:none!important}.login{max-width:420px;margin:12vh auto}.note{color:var(--muted);font-size:12px;line-height:1.5}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{text-align:center;padding:30px;color:var(--muted)}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}.request{padding:13px}}
</style></head><body><div class="wrap"><header class="brand"><img src="logo.png"><b>LOW<span>BATTERY</span> · ADMIN</b></header><section id="login" class="card login"><h2>Panel privado</h2><p class="note">Inicia sesión con el correo administrador autorizado.</p><form id="loginForm"><div style="margin:12px 0"><label>Email</label><input id="email" type="email" value="lyonsamuel11@gmail.com" required></div><div style="margin:12px 0"><label>Contraseña</label><input id="password" type="password" required></div><button style="width:100%">Ingresar</button></form><p id="loginError" class="note"></p></section><section id="dashboard" class="hidden"><div class="row" style="justify-content:space-between"><h1>Solicitudes</h1><button class="secondary" id="logout">Cerrar sesión</button></div><div class="stats"><div class="stat"><small>Recibidas</small><strong id="total">0</strong></div><div class="stat"><small>Pendientes</small><strong id="pending">0</strong></div><div class="stat"><small>Oferta enviada</small><strong id="offers">0</strong></div><div class="stat"><small>Compradas</small><strong id="bought">0</strong></div></div><section class="card"><div class="row"><input id="search" placeholder="Buscar modelo, nombre o contacto"><select id="filter"><option value="">Todos los estados</option><option>Pendiente</option><option>Evaluado</option><option>Oferta enviada</option><option>Vendido</option><option>Rechazado</option></select><button id="refresh">Actualizar</button></div></section><div id="list"></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://oevmrtddkqzsbvfngxly.supabase.co';const SUPABASE_KEY='sb_publishable_g-CvGKnUJme2cRkXrRzGfw_YV2dwvBy';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let requests=[];
const login=document.getElementById('login'),dash=document.getElementById('dashboard');async function check(){const{data:{session}}=await sb.auth.getSession();if(session&&session.user.email==='lyonsamuel11@gmail.com'){login.classList.add('hidden');dash.classList.remove('hidden');load();}else{dash.classList.add('hidden');login.classList.remove('hidden');}}document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error){document.getElementById('loginError').textContent=error.message;return;}check();};document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();check();};
async function load(){const{data,error}=await sb.from('requests').select('*').order('created_at',{ascending:false});if(error){alert('Error cargando solicitudes: '+error.message);return;}requests=data||[];document.getElementById('total').textContent=requests.length;document.getElementById('pending').textContent=requests.filter(x=>x.status==='Pendiente').length;document.getElementById('offers').textContent=requests.filter(x=>x.status==='Oferta enviada').length;document.getElementById('bought').textContent=requests.filter(x=>x.status==='Vendido').length;render();}
async function render(){const search=document.getElementById('search').value.toLowerCase(),filter=document.getElementById('filter').value;const items=requests.filter(r=>(!filter||r.status===filter)&&(!search||[r.name,r.contact,r.model].join(' ').toLowerCase().includes(search)));const list=document.getElementById('list');if(!items.length){list.innerHTML='<div class="card empty">No hay solicitudes con estos filtros.</div>';return;}list.innerHTML='';for(const r of items){let urls=[];for(const path of r.photo_paths||[]){const{data}=await sb.storage.from('request-photos').createSignedUrl(path,3600);if(data?.signedUrl)urls.push(data.signedUrl);}const div=document.createElement('article');div.className='request';div.innerHTML=`<span class="status">${esc(r.status||'Pendiente')}</span><h3>${esc(r.model)} · ${esc(r.storage)}</h3><div class="meta"><b>${esc(r.name)}</b> · ${esc(r.contact_type)}: ${esc(r.contact)}<br>Salud batería: ${r.battery}% · ${new Date(r.created_at).toLocaleString('es-CL')}<br>Problemas: ${esc((r.issues||[]).join(', ')||'No especificados')}<br>Mensaje: ${esc(r.extra_message||'—')}</div><div class="photos">${urls.map(u=>`<img src="${u}" alt="Foto del equipo">`).join('')}</div><div class="split"><div><label>Oferta (CLP)</label><input class="offer" type="number" min="0" value="${r.offer_clp||''}" placeholder="Ej. 180000"></div><div><label>Estado</label><select class="statusSelect">${['Pendiente','Evaluado','Oferta enviada','Vendido','Rechazado'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div style="margin-top:10px"><label>Notas privadas</label><textarea class="notes" placeholder="Notas internas">${esc(r.admin_notes||'')}</textarea></div><div class="row" style="margin-top:10px"><button class="save">Guardar cambios</button><button class="secondary copy">Copiar contacto</button></div>`;div.querySelector('.save').onclick=async()=>{const offer=div.querySelector('.offer').value;const status=div.querySelector('.statusSelect').value;const notes=div.querySelector('.notes').value;const{error}=await sb.from('requests').update({offer_clp:offer?Number(offer):null,status,admin_notes:notes}).eq('id',r.id);if(error)alert(error.message);else{alert('Cambios guardados');load();}};div.querySelector('.copy').onclick=()=>navigator.clipboard.writeText(r.contact);list.append(div);}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}document.getElementById('search').oninput=render;document.getElementById('filter').onchange=render;document.getElementById('refresh').onclick=load;check();
</script></body></html>
